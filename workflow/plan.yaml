version: 1
client: qwen-code
provider_protocol: openai
model: gpt-6-sol
wire_api: responses
steps:
  - id: install
    command: npm install -g @qwen-code/qwen-code
  - id: configure
    file: ~/.qwen/settings.json
    source: ../config/settings.example.json
  - id: secret
    environment: OPENAI_API_KEY
    note: export in the shell or place it in ~/.qwen/.env; never commit it
  - id: doctor
    command: qwen
    action: /doctor
  - id: schema-check
    note: use a local mock or inspect the final URL before an approved request
  - id: canary
    note: only after the live model catalog confirms gpt-6-sol and the budget is approved
